<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff4e8a,#6a11cb,#2575fc);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:25px;
    text-align:center;
    color:white;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
    animation:fadeIn 1.2s ease;
}

.hidden{
    display:none;
}

h1{
    font-size:34px;
    margin-bottom:15px;
}

h2{
    font-size:42px;
    color:#ffeb3b;
    margin-bottom:15px;
}

p{
    font-size:20px;
    line-height:1.5;
    margin-bottom:25px;
}

button{
    border:none;
    padding:14px 30px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    color:white;
    background:linear-gradient(45deg,#ff0066,#ff4d4d);
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

.photo-box{
    width:130px;
    height:130px;
    margin:0 auto 20px;
    border-radius:50%;
    border:4px solid white;
    overflow:hidden;
    box-shadow:0 0 20px rgba(255,255,255,0.4);
}

.photo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(25px);}
    to{opacity:1;transform:translateY(0);}
}

.heart{
    position:absolute;
    color:white;
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    from{
        transform:translateY(100vh) scale(0.5);
        opacity:1;
    }
    to{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
    }
}
</style>
</head>

<body>

<!-- INTRO PAGE -->
<div class="card" id="intro">
    <h1>✨ This is for Nethuni 💖</h1>
    <p>From Chirana ❤️</p>
    <button onclick="showBirthday()">Open Surprise 🎁</button>
</div>

<!-- BIRTHDAY PAGE -->
<div class="card hidden" id="birthday">
    <h1>🎂 Happy Birthday 🎉</h1>
    <p>
        Wishing you a day full of smiles, happiness, love, and all the beautiful moments you deserve 💖
    </p>
    <button onclick="showLove()">Continue ✨</button>
</div>

<!-- LOVE PAGE -->
<div class="card hidden" id="love">

    <!-- Replace photo.jpg with your image -->
    <div class="photo-box">
        <img src="photo.jpg" alt="Photo">
    </div>

    <h2>❤️ I Luv U ❤️</h2>
    <p>You mean more than words can say ✨</p>
</div>

<script>
function showBirthday(){
    document.getElementById("intro").classList.add("hidden");
    document.getElementById("birthday").classList.remove("hidden");
}

function showLove(){
    document.getElementById("birthday").classList.add("hidden");
    document.getElementById("love").classList.remove("hidden");
}

for(let i=0;i<25;i++){
    let heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*5+4)+"s";
    heart.style.fontSize=(Math.random()*20+15)+"px";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
